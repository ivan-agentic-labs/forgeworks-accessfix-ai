name: AccessFix Disposable Chromium Patch Proof
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'apps/api[test]' playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Install fixed axe-core version for disposable fixture
        run: |
          mkdir -p "$RUNNER_TEMP/accessfix-axe"
          npm --prefix "$RUNNER_TEMP/accessfix-axe" install --ignore-scripts --no-audit --no-fund --no-save axe-core@4.13.0
          test -s "$RUNNER_TEMP/accessfix-axe/node_modules/axe-core/axe.min.js"
          echo "ACCESSFIX_AXE_SCRIPT=$RUNNER_TEMP/accessfix-axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: Verify rendered patch and axe image-alt on isolated fixture
        env:
          ACCESSFIX_DISPOSABLE_BROWSER: 'yes'
        run: python -W error -m pytest tests/browser -q
