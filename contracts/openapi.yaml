components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VerificationChallenge:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - site_id
      - canonical_origin
      - verification_method
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        site_id:
          type: string
          format: uuid
        canonical_origin:
          type: string
        verification_method:
          type: string
        expires_at:
          type: string
          format: date-time
    VerificationResult:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - site_id
      - verified_until
      - proof_digest
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        site_id:
          type: string
          format: uuid
        verified_until:
          type: string
          format: date-time
        proof_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
    ScanJob:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - site_id
      - repo_commit_sha
      - network_policy_sha256
      - job_id
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        site_id:
          type: string
          format: uuid
        repo_commit_sha:
          type: string
          pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
        network_policy_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        job_id:
          type: string
          format: uuid
    AccessibilityFinding:
      type: object
      additionalProperties: false
      required:
      - id
      - scan_id
      - rule_id
      - severity
      - selector
      - fingerprint
      - manual_check_required
      - evidence
      - source_mapping
      properties:
        id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        rule_id:
          type: string
        severity:
          type: string
        selector:
          type: string
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        manual_check_required:
          type: boolean
        evidence:
          $ref: '#/components/schemas/FindingEvidence'
        source_mapping:
          $ref: '#/components/schemas/SourceMapping'
    EvidenceExport:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - product
      - scope
      - exported_at
      - scan
      - source
      - coverage
      - findings
      - proposals
      - limitations
      - bundle_sha256
      properties:
        schema_version:
          type: string
          const: forgeworks.accessfix.evidence/v1
        product:
          type: string
          const: accessfix-ai
        scope:
          type: string
          const: SYNTHETIC_LOCAL_FIXTURE_ONLY
        exported_at:
          type: string
          format: date-time
        scan:
          type: object
          additionalProperties: false
          required: [id, status, site_id, repo_commit_sha, revision_verified, network_policy_sha256, created_at, attempt_count]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, const: SUCCEEDED}
            site_id: {type: string, format: uuid}
            repo_commit_sha: {type: string, pattern: '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$'}
            revision_verified: {type: boolean, const: false}
            network_policy_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            created_at: {type: string, format: date-time}
            attempt_count: {type: integer, minimum: 1}
        source:
          type: object
          additionalProperties: false
          required: [kind, digest_sha256, byte_length, content_included, revision_verified]
          properties:
            kind: {type: string, const: LOCAL_FIXTURE}
            digest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            byte_length: {type: integer, minimum: 0}
            content_included: {type: boolean, const: false}
            revision_verified: {type: boolean, const: false}
        coverage:
          type: object
          additionalProperties: false
          required: [scan_mode, paths, pages_evaluated, rule_ids_evaluated, browser_rendered, wcag_conformance_claim]
          properties:
            scan_mode: {type: string, const: STATIC_LOCAL_HTML_FIXTURE}
            paths:
              type: array
              const: [/]
              items: {type: string}
            pages_evaluated: {type: integer, const: 1}
            rule_ids_evaluated:
              type: array
              const: [image-alt]
              items: {type: string}
            browser_rendered: {type: boolean, const: false}
            wcag_conformance_claim: {type: boolean, const: false}
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityFinding'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceProposal'
        limitations:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [SOURCE_REVISION_NOT_VERIFIED, RAW_SOURCE_AND_PATCH_CONTENT_OMITTED, NOT_SIGNED_OR_IMMUTABLE, NOT_A_WCAG_CONFORMANCE_CLAIM]
        bundle_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of minified UTF-8 JSON with this property omitted; recursively sort object keys in ascending Unicode code-point order, retain array order, encode non-ASCII characters as UTF-8, use JSON string escapes, allow only string/integer/boolean/null/container values (no floats), and add no trailing newline. Integrity check only, not a signature.
    EvidenceProposal:
      type: object
      additionalProperties: false
      required: [id, finding_id, base_sha, patch_sha256, source_sha256, patched_source_sha256, content_integrity_verified, status, retest_status, version, reviews]
      properties:
        id: {type: string, format: uuid}
        finding_id: {type: string, format: uuid}
        base_sha: {type: string, pattern: '^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$'}
        patch_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        source_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        patched_source_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        content_integrity_verified: {type: boolean, const: true}
        status: {type: string}
        retest_status: {type: string}
        version: {type: integer, minimum: 1}
        reviews:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, actor_id, decision, manual_check_status, proposal_version]
            properties:
              id: {type: string, format: uuid}
              actor_id: {type: string, format: uuid}
              decision: {type: string, enum: [approve, reject]}
              manual_check_status: {type: string, enum: [passed, failed, not_applicable]}
              proposal_version: {type: integer, minimum: 1}
    FixProposal:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - finding_id
      - base_sha
      - patch_sha256
      - patch
      - retest_status
      - version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        finding_id:
          type: string
          format: uuid
        base_sha:
          type: string
          pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
        patch_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        patch:
          type: string
          description: Actual unified diff against the stored local source snapshot.
        retest_status:
          type: string
        version:
          type: integer
          minimum: 1
          description: Current stored proposal version required as expected_version on review.
    ManualReview:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - proposal_id
      - reviewer_id
      - decision
      - manual_check_status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        proposal_id:
          type: string
          format: uuid
        reviewer_id:
          type: string
          format: uuid
        decision:
          type: string
        manual_check_status:
          type: string
    PullRequestResult:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      - proposal_id
      - github_pr_node_id
      - draft
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        proposal_id:
          type: string
          format: uuid
        github_pr_node_id:
          type: string
        draft:
          type: boolean
    CreateChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - canonical_origin
      - repository_id
      properties:
        canonical_origin:
          type: string
        repository_id:
          type: string
          format: uuid
    VerifySiteRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - evidence_token
      properties:
        challenge_id:
          type: string
          format: uuid
        evidence_token:
          type: string
    StartScanRequest:
      type: object
      additionalProperties: false
      required:
      - repo_commit_sha
      - paths
      properties:
        repo_commit_sha:
          type: string
          pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
        paths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 2048
    CreateFixRequest:
      type: object
      additionalProperties: false
      required:
      - source_mapping_id
      - alt_text
      properties:
        source_mapping_id:
          type: string
          format: uuid
        alt_text:
          type: string
          minLength: 1
          maxLength: 500
          description: Owner-authored alternative text; semantic quality requires human review.
    ReviewFixRequest:
      type: object
      additionalProperties: false
      required:
      - patch_sha256
      - decision
      - manual_check_status
      - expected_version
      properties:
        patch_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        decision:
          type: string
          enum:
          - approve
          - reject
          description: Approval or rejection, performed only by a verified authorized human principal.
        manual_check_status:
          type: string
          enum:
          - passed
          - failed
          - not_applicable
          description: Human accessibility verification status; approval requires passed for any necessary manual
            tests.
        expected_version:
          type: integer
          minimum: 1
          description: Optimistic lock for reviewed resource; stale version rejected with HTTP 409.
    RetestRequest:
      type: object
      additionalProperties: false
      required:
      - repo_commit_sha
      - expected_version
      properties:
        repo_commit_sha:
          type: string
          pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
          description: Must equal the proposal base revision; other revisions are rejected fail-closed.
        expected_version:
          type: integer
          minimum: 1
    RetestAccepted:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - proposal_id
      - repo_commit_sha
      - retest_status
      - version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACCEPTED
        proposal_id:
          type: string
          format: uuid
        repo_commit_sha:
          type: string
          pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
        retest_status:
          type: string
        version:
          type: integer
          minimum: 1
    FindingEvidence:
      type: object
      additionalProperties: false
      required:
      - kind
      - digest_sha256
      properties:
        kind:
          type: string
          enum:
          - DOM_SNIPPET
        digest_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    SourceMapping:
      type: object
      additionalProperties: false
      required:
      - id
      - verified
      - source_revision
      - revision_verified
      - source_kind
      properties:
        id:
          type: string
          format: uuid
        verified:
          type: boolean
          description: Finding is mapped to a unique local source image; does not verify a Git revision.
        revision_verified:
          type: boolean
          const: false
        source_kind:
          type: string
          const: LOCAL_FIXTURE
        source_revision:
          type: string
          pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
    PublishFixRequest:
      type: object
      additionalProperties: false
      required:
      - review_id
      properties:
        review_id:
          type: string
          format: uuid
    AccessibilityFindingPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessibilityFinding'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    Problem:
      type: object
      description: RFC 9457 problem details, with stable application extension code and correlation request_id
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable problem type URI; about:blank allowed
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        request_id:
          type: string
          minLength: 1
      example:
        type: about:blank
        title: Conflict
        status: 409
        detail: Resource version is stale
        code: STALE_VERSION
        request_id: request_example_001
    CreateUploadIntentRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - filename
      - size_bytes
      - sha256
      properties:
        kind:
          type: string
          minLength: 1
        filename:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256: &id002
          type: string
          pattern: ^[0-9a-f]{64}$
        declared_media_type: &id003
          type: string
    UploadIntent:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - status
      - upload_url
      - expires_at
      - required_headers
      properties:
        artifact_id: *id001
        status:
          type: string
          enum:
          - INTENT_ISSUED
        upload_url:
          type: string
          format: uri
        expires_at: &id004
          type: string
          format: date-time
        required_headers:
          type: object
          additionalProperties:
            type: string
    CommitUploadRequest:
      type: object
      additionalProperties: false
      required:
      - sha256
      - size_bytes
      - object_generation
      properties:
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 1
        object_generation:
          type: string
          minLength: 1
    ArtifactRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - kind
      - sha256
      - size_bytes
      - created_at
      properties:
        id: *id001
        status:
          type: string
          enum:
          - INTENT_ISSUED
          - QUARANTINED
          - VALIDATING
          - AVAILABLE
          - REJECTED
          - EXPIRED
          - DELETED
        kind: *id003
        sha256: *id002
        size_bytes:
          type: integer
          minimum: 0
        created_at: *id004
        rejected_reason:
          type:
          - string
          - 'null'
    DownloadIntent:
      type: object
      additionalProperties: false
      required:
      - artifact_id
      - download_url
      - expires_at
      - object_generation
      properties:
        artifact_id: *id001
        download_url:
          type: string
          format: uri
        expires_at: *id004
        object_generation: *id003
    JobStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - state
      - created_at
      - state_version
      - attempt_count
      properties:
        id: *id001
        kind: *id003
        state:
          type: string
          enum:
          - PENDING
          - RUNNING
          - WAITING_APPROVAL
          - SUCCEEDED
          - FAILED_RETRYABLE
          - FAILED_TERMINAL
          - CANCELLED
          - BLOCKED
          - RECONCILIATION_REQUIRED
        created_at: *id004
        state_version:
          type: integer
          minimum: 1
        attempt_count:
          type: integer
          minimum: 0
        last_error_code:
          type:
          - string
          - 'null'
