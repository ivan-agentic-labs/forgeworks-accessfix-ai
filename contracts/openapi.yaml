openapi: 3.1.2
info:
  title: AccessFix AI API contract design (not deployed)
  version: 0.4.2-design-candidate
  description: Architecture hardening v4.2. NOT DEPLOYED. Formal external OpenAPI conformance verification remains
    pending.
servers:
- url: https://api.example.invalid
  description: Non-functional placeholder; DO NOT deploy or send credentials
paths:
  /v1/offline/html-findings:
    post:
      operationId: post_v1_offline_html_findings
      summary: Analyze supplied HTML without remote network access
      description: Bounded user-supplied static image-alt findings; no browser execution or WCAG certification.
      security:
      - BearerAuth: []
      tags:
      - AccessFix AI
      x-required-scope: scan:start
      x-network-egress: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_html]
              properties:
                source_html:
                  type: string
                  minLength: 1
                  maxLength: 1048576
      responses:
        '200':
          description: Complete bounded findings
          content:
            application/json:
              schema:
                type: object
                required: [source_kind, scan_mode, source_sha256, finding_count, findings, limitations]
                properties:
                  source_kind:
                    type: string
                    const: USER_SUPPLIED_HTML
                  scan_mode:
                    type: string
                    const: OFFLINE_STATIC_IMAGE_ALT
                  source_sha256:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  finding_count:
                    type: integer
                    minimum: 0
                    maximum: 500
                  findings:
                    type: array
                    maxItems: 500
                    items: {type: object}
                  limitations:
                    type: array
                    items: {type: string}
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '403':
          description: Missing scan scope
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '413':
          description: Finding budget exceeded
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422':
          description: Invalid or oversized HTML
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
